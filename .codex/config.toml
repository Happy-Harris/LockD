# Project-level Codex settings. User-level settings in ~/.codex/config.toml still apply underneath;
# this file only sets safe defaults for working in this repository. No model, key or URL is set here.

# Ask before running commands that leave the workspace sandbox.
approval_policy = "on-request"

# Read the repo and write inside it. The sandbox has no network by default: install dependencies once
# (`npm ci`) before a session, or approve the request when Codex asks.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
